name: Build and release
run-name: Android / macOS / Windows · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  push:
    branches: [dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Version tags always build; release.py rejects leading zeroes and missing changelogs.
    # Branch pushes skip documentation-only changes; the reserved pre tag never triggers.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      # This document is bundled in the application.
      - 'docs/privacy.md'
  pull_request:
    branches: [dev]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      - 'docs/privacy.md'
  workflow_dispatch:

permissions:
  contents: read

# Match the hosted source recorded in pubspec.lock on every runner.
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

# PR checks cancel older checks for that PR; publication remains serialized.
concurrency:
  group: huarunwin-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('release-{0}', github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/dev' && 'pre' || github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate local and tagged release Hub changelogs
        run: python3 tool/ci/release.py validate
      - name: Resolve release version
        if: github.event_name != 'pull_request'
        run: python3 tool/ci/release.py metadata
      - name: Install FVM
        run: brew install leoafarias/fvm/fvm
      - name: Select the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Analyze and test
        run: |
          python3 -m unittest discover -s tool/ci -p 'test_*.py'
          python3 tool/ci/build.py verify
          python3 tool/check_installer.py

  macos:
    needs: build
    if: github.event_name != 'pull_request'
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: amd64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release version
        run: python3 tool/ci/release.py metadata
      - name: Install FVM
        run: brew install leoafarias/fvm/fvm
      - name: Select the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Build and package macOS DMG
        run: python3 tool/ci/build.py package ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: build/release/packages/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  android:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate local and tagged release Hub changelogs
        run: python3 tool/ci/release.py validate
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install FVM
        run: brew install leoafarias/fvm/fvm
      - name: Select the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Compile Android application and instrumentation
        run: |
          fvm flutter build apk --debug --no-pub
          cd android
          ./gradlew :app:assembleDebugAndroidTest
      - name: Resolve release version
        id: android_metadata
        if: github.event_name != 'pull_request'
        run: python3 tool/ci/release.py metadata
      - name: Build and verify signed APKs
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets[format('{0}_SIGNING_CERT_SHA256', steps.android_metadata.outputs.android_signing_prefix)] }}
        run: python3 tool/ci/android_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: package-android
          path: |
            build/release/packages/*-android-*.apk
            build/release/packages/*-android-signing.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-2022
            fvm_arch: x64
            fvm_sha256: 97696d118ad35bf25dc91fd28c70bb3d77b6d1fee6658fbd744e838b5f81da4a
          - arch: arm64
            os: windows-11-arm
            fvm_arch: arm64
            fvm_sha256: ea10b12a756d0b66476f303f47a1169c662c84b9a98a6debd7529ee564ec6869
    defaults:
      run:
        shell: pwsh
    env:
      FVM_VERSION: '4.3.2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Validate local and tagged release Hub changelogs
        run: python tool/ci/release.py validate
      - name: Install native FVM
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'fvm.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'fvm'
          Invoke-WebRequest "https://github.com/btwld/fvm/releases/download/$env:FVM_VERSION/fvm-$env:FVM_VERSION-windows-${{ matrix.fvm_arch }}.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '${{ matrix.fvm_sha256 }}') { throw 'FVM checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $executables = @(Get-ChildItem -LiteralPath $directory -Filter fvm.exe -File -Recurse)
          if ($executables.Count -ne 1) { throw 'FVM archive must contain one executable' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $executables[0].DirectoryName
      - name: Select the pinned Flutter SDK
        run: python tool/ci/build.py setup
      - name: Install dependencies
        run: python tool/ci/build.py deps
      - name: Compile Windows application
        if: github.event_name == 'pull_request'
        run: fvm flutter build windows --debug --no-pub
      - name: Resolve release version
        if: github.event_name != 'pull_request'
        run: python tool/ci/release.py metadata
      - name: Build and package Windows
        if: github.event_name != 'pull_request'
        run: ./tool/ci/package_windows.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: package-windows-${{ matrix.arch }}
          path: |
            build/release/packages/*-windows-${{ matrix.arch }}-setup.exe
            build/release/packages/*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    needs: [build, macos, android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: build/release/packages
      - name: Resolve release version
        run: python3 tool/ci/release.py metadata
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/ci/release.py publish
