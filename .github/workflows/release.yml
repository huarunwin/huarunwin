name: Build and release
run-name: Android / macOS / Windows · ${{ github.ref_name }} · ${{ github.run_number }}

on:
  push:
    branches: [dev]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Version tags always build; release.py rejects leading zeroes and missing Hub changelogs.
    # Branch pushes skip documentation-only changes; the reserved pre tag never triggers.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      # This document is bundled in the application.
      - 'docs/privacy.md'
  pull_request:
    branches: [dev]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!**/.gitignore'
      - 'docs/privacy.md'
  workflow_dispatch:

permissions:
  contents: read

# Match the hosted source recorded in pubspec.lock on every runner.
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

# PR checks cancel older checks for that PR; publication remains serialized.
concurrency:
  group: huarunwin-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('release-{0}', github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/dev' && 'pre' || github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate formal tag Hub changelog
        run: python3 tool/ci/release.py validate
      - name: Resolve release version
        if: github.event_name != 'pull_request'
        run: python3 tool/ci/release.py metadata
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: ${{ github.ref_type != 'tag' }}
      - name: Verify the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Analyze and test
        run: |
          python3 -m unittest discover -s tool/ci -p 'test_*.py'
          python3 tool/ci/build.py verify
          python3 tool/check_installer.py
          python3 tool/check_admin_helper.py

  macos:
    needs: build
    if: github.event_name != 'pull_request'
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: amd64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release version
        run: python3 tool/ci/release.py metadata
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: ${{ github.ref_type != 'tag' }}
      - name: Verify the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Build and package macOS DMG
        run: python3 tool/ci/build.py package ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: build/release/packages/*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  android:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate formal tag Hub changelog
        run: python3 tool/ci/release.py validate
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: ${{ github.ref_type != 'tag' }}
      - name: Verify the pinned Flutter SDK
        run: python3 tool/ci/build.py setup
      - name: Install dependencies
        run: python3 tool/ci/build.py deps
      - name: Compile Android application and instrumentation
        run: |
          flutter build apk --debug --no-pub
          cd android
          ./gradlew :app:assembleDebugAndroidTest
      - name: Resolve release version
        id: android_metadata
        if: github.event_name != 'pull_request'
        run: python3 tool/ci/release.py metadata
      - name: Build and verify signed APKs
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', steps.android_metadata.outputs.android_signing_prefix)] }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets[format('{0}_SIGNING_CERT_SHA256', steps.android_metadata.outputs.android_signing_prefix)] }}
        run: python3 tool/ci/android_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: package-android
          path: |
            build/release/packages/*-android-*.apk
            build/release/packages/*-android-signing.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.ref == 'refs/heads/dev' || (github.ref_type == 'tag' && github.ref_name != 'pre')
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-2022
            flutter_channel: stable
          - arch: arm64
            os: windows-11-arm
            flutter_channel: master
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Validate formal tag Hub changelog
        run: python tool/ci/release.py validate
      # ARM64 uses a source checkout at the .fvmrc tag because stable has no host archive.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version-file: .fvmrc
          cache: ${{ github.ref_type != 'tag' }}
      - name: Verify the pinned Flutter SDK
        run: python tool/ci/build.py setup
      - name: Install dependencies
        run: python tool/ci/build.py deps
      - name: Compile Windows application
        if: github.event_name == 'pull_request'
        run: flutter build windows --debug --no-pub
      - name: Resolve release version
        if: github.event_name != 'pull_request'
        run: python tool/ci/release.py metadata
      - name: Build and package Windows
        if: github.event_name != 'pull_request'
        run: ./tool/ci/package_windows.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: package-windows-${{ matrix.arch }}
          path: |
            build/release/packages/*-windows-${{ matrix.arch }}-setup.exe
            build/release/packages/*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    needs: [build, macos, android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: build/release/packages
      - name: Resolve release version
        run: python3 tool/ci/release.py metadata
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/ci/release.py publish
